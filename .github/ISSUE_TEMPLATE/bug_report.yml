name: Bug report
description: Report a bug in md
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands and Markdown snippet if relevant
      placeholder: |
        md README.md
        echo '# hi' | md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `md --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / terminal
      placeholder: macOS 15 / iTerm2
    validations:
      required: true
