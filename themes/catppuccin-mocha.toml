[meta]
name = "catppuccin-mocha"
variant = "dark"

[palette]
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
blue = "#89b4fa"
lavender = "#b4befe"
sapphire = "#74c7ec"
sky = "#89dceb"
teal = "#94e2d5"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
maroon = "#eba0ac"
red = "#f38ba8"
mauve = "#cba6f7"
pink = "#f5c2e7"
flamingo = "#f2cdcd"
rosewater = "#f5e0dc"

[heading]
h1 = { fg = "mauve", bold = true, underline = true }
h2 = { fg = "blue", bold = true }
h3 = { fg = "green", bold = true }
h4 = { fg = "yellow", bold = true }
h5 = { fg = "peach", bold = true }
h6 = { fg = "overlay0", bold = true }
rule_char = "─"
rule_color = "surface0"

[code]
inline_fg = "red"
inline_bg = "surface0"
block_border = "surface1"
block_bg = "mantle"
syntax_theme = "base16-ocean.dark"
line_numbers = true
lang_label = true

[text]
bold = { bold = true }
italic = { italic = true }
strikethrough = { strikethrough = true }

[link]
text = "blue"
url = "overlay0"
style = "underline"

[blockquote]
border = "blue"
text = "subtext0"
border_char = "▌"

[list]
bullet_chars = ["●", "○", "■", "□"]
number_style = { fg = "yellow" }
task_done = "✓"
task_pending = "○"
task_done_color = "green"
task_pending_color = "overlay0"

[table]
border = "surface1"
header = { bold = true, fg = "text" }
separator = "surface0"
style = "rounded"

[hr]
char = "─"
color = "surface1"
style = "full"

[image]
show_alt = true
style = { fg = "yellow", italic = true }
prefix = "🖼 "

[alert]
note_color = "blue"
tip_color = "green"
important_color = "mauve"
warning_color = "yellow"
caution_color = "red"
