[package]
name = "md"
version = "0.2.0"
edition = "2024"
description = "Render Markdown beautifully in the terminal"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/tejus3131/md"
homepage = "https://github.com/tejus3131/md"
authors = ["Tejus Gupta <tejus3131@tejusgupta.dev>"]
keywords = ["markdown", "terminal", "cli", "renderer", "tui"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "md"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.36", default-features = false, features = ["syntect"] }
syntect = "5"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
directories = "6"
thiserror = "2"

[dev-dependencies]
insta = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
